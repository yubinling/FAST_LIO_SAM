detect_file_path: "/home/lingyubin/Documents/lyb/livo/limot_ws/detect_msg/test3_detection.txt"
common:
    lid_topic:  /velodyne_points_0     #"/velodyne_points"
    imu_topic:  /imu/data         #"/imu/data"
    gnss_topic:  /navsat/fix
    time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
#NCLT
#    lid_topic: "/points_raw"
#    imu_topic: "/imu_raw"

#KITTI
#    lid_topic: "/kitti/velo/pointcloud"
#    imu_topic: "/kitti/oxts/imu"

#RS LiDar
#    lid_topic: "/rslidar"
#    imu_topic: "/imu"
limot:
  Scorethre: 0.5                        #recommend: 0.5
  if_priorfactor: true
  if_dynamic: true
#   pubtrackedobjects
  window_size: 5
  egoP_egoP: 1.0e-6
  egoP_objP: 1.0e-2
  ego_stationObjP: 1.0e-2
  objP_objP_chgP: 1.0
  chgP_chgP: 1.0e-2
  rubostNum: 1.0 
  saveObject: false
  saveObjectResult: true
  saveFramePose: true
  sequence: "04"
  vel_threshold: 1.0
  laserCloudInfoHandler_size: 100   # 100 is enough
    
preprocess:
    lidar_type: 2                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 
    scan_line: 32
    scan_rate: 10                # only need to be set for velodyne, unit: Hz,
    timestamp_unit: 2            # the unit of time/t field in the PointCloud2 rostopic: 0-second, 1-milisecond, 2-microsecond, 3-nanosecond.
    blind: 2

mapping:
    acc_cov: 0.1
    gyr_cov: 0.01
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    180
    det_range:     100.0
    extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic,
    extrinsic_T: [ 0, 0, 0.28 ]
    extrinsic_R: [ 0, 1, 0,
                    -1,  0,  0,
                    0,  0,  1]
    t_imu_gnss: [ 0, 0, 0.36 ] #gnss指向imu
publish:
    path_en:  true
    scan_publish_en:  true       # false: close all the point cloud output
    dense_publish_en: true       # false: low down the points number in a global-frame point clouds scan.
    scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

pcd_save:
    pcd_save_en: false
    interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                 # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

# voxel filter paprams
odometrySurfLeafSize: 0.4                     # default: 0.4 - outdoor, 0.2 - indoor
mappingCornerLeafSize: 0.2                    # default: 0.2 - outdoor, 0.1 - indoor
mappingSurfLeafSize: 0.4                      # default: 0.4 - outdoor, 0.2 - indoor

# keyframe storage
dense_keyframe: true                           # true: 关键帧存储feats_undistort(去畸变完整点云), false: 存储feats_down_body(降采样点云)

# robot motion constraint (in case you are using a 2D robot)
z_tollerance: 1000                            # meters
rotation_tollerance: 1000                     # radians

# CPU Params
numberOfCores: 4                              # number of cores for mapping optimization
mappingProcessInterval: 0.15                  # seconds, regulate mapping frequency

# Surrounding map
surroundingkeyframeAddingDistThreshold: 10  #1.0   # meters, regulate keyframe adding threshold
surroundingkeyframeAddingAngleThreshold: 0.2  # radians, regulate keyframe adding threshold
surroundingKeyframeDensity: 2.0               # meters, downsample surrounding keyframe poses   
surroundingKeyframeSearchRadius: 50.0         # meters, within n meters scan-to-map optimization (when loop closure disabled)

# Loop closure
loopClosureEnableFlag: true
loopClosureFrequency: 1.0                     # Hz, regulate loop closure constraint add frequency
surroundingKeyframeSize: 20                   # submap size (when loop closure enabled)
historyKeyframeSearchRadius: 5 #1.5             # meters, key frame that is within n meters from current pose will be considerd for loop closure
historyKeyframeSearchTimeDiff: 30.0           # seconds, key frame that is n seconds older will be considered for loop closure
historyKeyframeSearchNum: 20                  # number of hostory key frames will be fused into a submap for loop closure
historyKeyframeFitnessScore: 0.2              # icp threshold, the smaller the better alignment
loopClosureNoiseScore: 0.01                    # loop closure noise score for factor graph optimization (variance)

# GPS Settings
use_gnss: false                             # true: add GPS factors
useImuHeadingInitialization: true           # if using GPS data, set to "true"
useGpsElevation: true                     # if GPS elevation is bad, set to "false"
gpsCovThreshold: 2.0                        # m^2, threshold for using GPS data
poseCovThreshold: 0 #25.0                      # m^2, threshold for using GPS data  位姿协方差阈值 from isam2
gpsNoiseMin: 0.01                            # m^2, minimum GPS noise to avoid too small values
 

# Visualization
globalMapVisualizationSearchRadius: 100.0    # meters, global map visualization radius
globalMapVisualizationPoseDensity: 10      # meters, global map visualization keyframe density
globalMapVisualizationLeafSize: 1.0           # meters, global map visualization cloud density

# visual iktree_map  
visulize_IkdtreeMap: false

# reconstruct iktree_map  
reconstructKdTree: true
if_reconstruct_ikdtree_map_add_gps: true               # true: reconstruct ikdtree map when add gps factor
if_reconstruct_ikdtree_map_loop_closure: true          # true: reconstruct ikdtree map when loop closure
reconstruct_ikdtree_mode_add_gps: 0                     # 0: reconstruct the ikdtree map with riduas frame; 1: reconstruct the ikdtree map with a fixed frame(例如时间上的邻近五个关键帧)
reconstruct_ikdtree_mode_loop_closure: 0
reconstruct_ikdtree_frame: 3                    # number of frames for reconstructing ikdtree map when reconstruct_ikdtree_mode=1
reconstruct_ikdtree_search_radius: 50.0               # meters, leaf size for reconstructing ikdtree map
reconstruct_pose_density: 10.0                           # meters, downsample surrounding keyframe poses for reconstructing ikdtree map
reconstruct_leafsize: 1.0                             # meters, downsample point cloud for reconstructing ikdtree map
add_gps_num_reconstruct: 4                              #在添加gps的时候重构kdtree，updatekdtree数字大于等于这个数之后，才会reconstruct

# Export settings
savePCD: true                         # https://github.com/TixiaoShan/LIO-SAM/issues/3
savePCDDirectory: "/home/lingyubin/Documents/lyb/livo/fastliosam/src/FAST_LIO_SAM/FAST_LIO_SAM/result"        # in your home folder, starts and ends with "/". Warning: the code deletes "LOAM" folder then recreates it. See "mapOptimization" for implementation

